name: Test

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating System"
        required: true
        type: choice
        options:
          - '["ubuntu-24.04", "ubuntu-26.04-arm", "macos-26-intel", "macos-26", "windows-2025"]'
          - '["ubuntu-24.04"]'
          - '["ubuntu-26.04-arm"]'
          - '["macos-26-intel"]'   # x64
          - '["macos-26"]'         # arm64
          - '["windows-2025"]'     # x64

defaults:
  run:
    shell: bash

jobs:
  release:
    strategy:
      matrix:
        os: ${{ fromJson(inputs.os) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Setup Java 
      uses: actions/setup-java@v5
      with:
        distribution: zulu # circumvent jmod issue with temurin in jlink plugin task
        java-version: 26

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Make gradlew executable on Linux/MacOS
      if: runner.os != 'Windows'
      run: chmod +x ./gradlew

    - name: Run tests
      run: ./gradlew test
